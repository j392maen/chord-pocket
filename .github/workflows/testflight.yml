name: Build & upload to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          for v in BUNDLE_ID TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do [ -z "${!v}" ] && missing="$missing $v"; done
          [ -z "${{ secrets.ASC_KEY_P8 }}" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Unit test the C synth engine
        run: |
          cd test
          clang -std=c11 -O2 -o harness harness.c ../ios/ChordPocket/Engine/cpsynth.c -lm
          ./harness

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Archive unsigned: signing happens once, at export, with the team's cloud-managed
      # distribution certificate. (Signing at archive time would mint a new development
      # certificate on every ephemeral runner.)
      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ChordPocket.xcodeproj \
            -scheme ChordPocket \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ChordPocket.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*Chord|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/ChordPocket.xcarchive" || { tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Export, sign and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ChordPocket.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
